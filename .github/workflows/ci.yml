name: ci

# Testes (unitários + arquitetura) em todo push e pull request.
# Numa tag v* (ex.: v1.0.0), publica a imagem leandrocanha/minicrm-bff no Docker Hub.
# Só roda depois que o projeto Node existir (package.json na raiz).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projeto criado?
        id: projeto
        run: |
          if [ -f package.json ]; then echo "existe=true" >> "$GITHUB_OUTPUT"; else echo "Ainda sem package.json: nada a testar." && echo "existe=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.projeto.outputs.existe == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.projeto.outputs.existe == 'true'
        run: npm ci
      - if: steps.projeto.outputs.existe == 'true'
        run: npm test
      - if: steps.projeto.outputs.existe == 'true'
        run: npm run build

  # Secrets: DOCKERHUB_USERNAME e DOCKERHUB_TOKEN (token com permissão Read & Write).
  imagem:
    needs: testes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/minicrm-bff:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/minicrm-bff:latest
